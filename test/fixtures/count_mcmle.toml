name = "count_mcmle"

[provenance]
r_version = "4.6.1"
ergm_count_version = "4.1.3"
ergm_version = "4.12.0"
network_version = "1.20.0"
seed = 20261002
script = "test/fixtures/r/count_mcmle.R"
date = "2026-10-02"
models = "(a) zach ~ sum + nonzero + transitiveweights(min,max,min), response=contexts, reference=~Poisson; (b) a seeded 14-actor directed count matrix ~ sum + nonzero + mutual(form=min), response=w, reference=~Poisson"
estimator = "ergm.count MCMLE at control.ergm defaults, nine seeds (1..9) per model; hp_* = one fit at MCMC.samplesize=16384, MCMC.interval=2048 (seed 4242)"

[tolerance]
# Observed statistics are deterministic functions of the graph.
summary_statistics = 1e-9
#
# Both estimators are Monte-Carlo MLEs of the same likelihood, so they are
# compared at R's own resolution. For coefficient k a Julia fit must lie
# within  band_sd * sqrt(sd_k^2 + sd_k^2 / n_seeds)  of R's nine-seed mean,
# where sd_k is R's seed-to-seed standard deviation (`*_coefficients_sd`):
# the first term is one fit's own Monte-Carlo error (taken equal to R's),
# the second the error of R's mean. A band floored at
# `floor_se_fraction` of R's mean standard error keeps a coefficient whose
# nine R fits happened to agree unusually closely from demanding more than
# either sampler's O(1/ESS) bias allows. Standard errors likewise, against
# `*_std_errors_sd`, floored at `floor_se_fraction` of the standard error.
band_sd = 4.0
floor_se_fraction = 0.1
# The relative log-likelihood (bridge sampling on both sides): within
# band_sd * sqrt(2) * R's seed-to-seed sd, floored at 1.0 log unit.
loglik_floor = 1.0

