name = "count_terms"

[provenance]
r_version = "4.6.1"
ergm_count_version = "4.1.3"
ergm_version = "4.12.0"
network_version = "1.20.0"
seed = 20260912
script = "test/fixtures/r/count_terms.R"
date = "2026-09-13"
datasets = "ergm.count::zach (Zachary 1977): 34 karate-club members, undirected, `contexts` edge counts 0-7; an 8-actor directed count matrix rpois(64, 1.2) with zero diagonal under the seed above, frozen below"
model_zach = "zach ~ sum + nonzero + greaterthan(2) + greaterthan(4) + atleast(3) + transitiveweights(min,max,min) + cyclicalweights(min,max,min) + smallerthan(2) + equalto(3) + ininterval(1,3) + ininterval(1,3,open=c(FALSE,FALSE)) + greaterthan(-1) + atleast(0), response=\"contexts\" -- summary() only"
model_zero_weight = "zw ~ nonzero + sum + greaterthan(-1) + atleast(0) + greaterthan(0) + atleast(1) + smallerthan(1) + equalto(0) + ininterval(-1,1), response=\"w\" -- summary() only; zw is a 3-actor directed network with ties 1->2 (value 2) and 2->3 (value 0)"
model_directed = "nw ~ sum + nonzero + greaterthan(2) + greaterthan(4) + atleast(3) + transitiveweights(min,max,min) + cyclicalweights(min,max,min) + mutual(form=min/nabsdiff/geometric/product) + smallerthan(2) + equalto(3) + ininterval(1,3) with open = (TRUE,TRUE), (FALSE,FALSE), (TRUE,FALSE), (FALSE,TRUE), response=\"w\" -- summary() only"
model_negative = "nn ~ sum + nonzero + greaterthan(0) + atleast(0) + smallerthan(0) + equalto(-1) + ininterval(-2,1) + ininterval(-2,1,open=c(FALSE,FALSE)) + mutual(form=min/nabsdiff/product), response=\"w\" -- summary() only; nn is a 6-actor directed network with values in -2:2 frozen below; transitiveweights, cyclicalweights are REFUSED by ergm there (errors frozen) and mutual(form=geometric) is NaN"
not_pinned = "mutual(form=threshold): ergm 4.12.0 errors at C model initialisation (r_error_mutual_threshold below); ERGMCount.jl implements the documented definition and tests it by hand value"

[tolerance]
# Every value is a DETERMINISTIC function of the observed graph -- no
# estimator, no simulation. Machine precision; a disagreement is a bug in a
# term formula (or in the ordered/unordered pair convention). 1e-9 leaves
# room only for the sqrt in mutual.geom.mean. DO NOT LOOSEN.
zach_summary = 1e-9
directed_summary = 1e-9
zero_weight_summary = 1e-9
negative_summary = 1e-9

