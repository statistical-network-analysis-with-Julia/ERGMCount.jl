name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  # Siblings are cloned at their current `main`. The nightly run re-tests this
  # package against whatever they have become, even when nothing here moved.
  # NetworkCore.jl and ERGM.jl also dispatch this workflow after each push to their
  # `main` (their Downstream.yml). Start times are staggered across packages.
  schedule:
    - cron: '47 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    # A regression in Julia nightly is reported, not a red badge.
    continue-on-error: ${{ matrix.version == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        version:
          # The ecosystem requires Julia >= 1.12.
          - '1.12'
          - '1'
          - 'nightly'
        os:
          - ubuntu-latest
          - windows-latest
        arch:
          - x64
        exclude:
          - version: 'nightly'
            os: windows-latest
        include:
          # macos-latest is Apple silicon: run native aarch64 Julia there
          # (setup-julia v3 refuses x64 on it unless forced to emulate).
          - version: '1.12'
            os: macos-latest
            arch: aarch64
          - version: '1'
            os: macos-latest
            arch: aarch64
    env:
      # Coverage is collected on the Linux 1.12 cell, and only when the
      # repository has a CODECOV_TOKEN secret (tokenless uploads are refused).
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}
    steps:
      # Check the package out in a directory named after it, so that the
      # siblings cloned below sit beside it as they do locally.
      - uses: actions/checkout@v7
        with:
          path: ERGMCount.jl

      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}

      # >>> ecosystem layout (generated by tools/sync_workflows.jl in the site repository; edit tools/workflows/layout-step.yml there, not here)
      # The packages are separate repositories that find each other through
      # [sources] path entries such as `NetworkCore = {path = "../NetworkCore.jl"}`.
      # This step clones every sibling that this repository's Project.toml files
      # name (the package, docs/, benchmark/, examples/...), and then every
      # sibling those siblings depend on, until the set is closed. It clones
      # each sibling's current `main`, checks the package name and UUID, and
      # prints the revision of every checkout. The package must be checked out
      # at `path: <Pkg>.jl`. With LAYOUT_CHECK_ONLY=true it clones nothing and
      # fails on a missing sibling instead.
      - name: Reconstruct the ecosystem layout from [sources]
        shell: julia --startup-file=no --color=yes {0}
        run: |
          using TOML
          const ORG = "https://github.com/statistical-network-analysis-with-Julia"
          canonical(path) = rstrip(normpath(abspath(path)), ['/', '\\'])
          workspace = canonical(ENV["GITHUB_WORKSPACE"])
          self = basename(ENV["GITHUB_REPOSITORY"])
          root = joinpath(workspace, self)
          check_only = get(ENV, "LAYOUT_CHECK_ONLY", "false") == "true"
          isfile(joinpath(root, "Project.toml")) ||
              error("Check this repository out with `path: $self`, so siblings can sit beside it.")
          # Every environment of this repository: its own deps, weak deps and
          # test extras all count. A sibling contributes only its [deps].
          queue = Tuple{String,Bool}[]
          for (dir, _, files) in walkdir(root)
              occursin(r"[\\/]\.git([\\/]|$)", dir) && continue
              "Project.toml" in files && push!(queue, (joinpath(dir, "Project.toml"), true))
          end
          seen = Set{String}()
          checkouts = Dict{String,String}()
          while !isempty(queue)
              project, own = popfirst!(queue)
              project in seen && continue
              push!(seen, project)
              meta = TOML.parsefile(project)
              uuids = Dict{String,Any}()
              for table in (own ? ("extras", "weakdeps", "deps") : ("deps",))
                  merge!(uuids, get(meta, table, Dict{String,Any}()))
              end
              for (name, source) in sort!(collect(get(meta, "sources", Dict{String,Any}())); by=first)
                  haskey(uuids, name) && source isa AbstractDict && haskey(source, "path") || continue
                  target = canonical(joinpath(dirname(project), source["path"]))
                  target == canonical(root) && continue
                  dirname(target) == workspace && basename(target) == "$name.jl" ||
                      error("$project: [sources] $name must be the sibling ../$name.jl, not $target")
                  if !isdir(target)
                      check_only && error("Missing sibling checkout $target (needed by $project)")
                      for attempt in 1:3
                          success(`git clone --depth 1 --quiet $ORG/$name.jl $target`) && break
                          attempt == 3 && error("Could not clone $ORG/$name.jl")
                          rm(target; force=true, recursive=true)
                          sleep(10 * attempt)
                      end
                  end
                  sibling = TOML.parsefile(joinpath(target, "Project.toml"))
                  get(sibling, "name", "") == name || error("$target does not hold package $name")
                  get(sibling, "uuid", "") == uuids[name] ||
                      error("UUID of $name in $target differs from the one $project records")
                  checkouts[name] = target
                  push!(queue, (joinpath(target, "Project.toml"), false))
              end
          end
          rows = ["| $(basename(path)) | `$(readchomp(`git -C $path rev-parse HEAD`))` |"
                  for path in vcat(root, [checkouts[name] for name in sort!(collect(keys(checkouts)))])]
          report = join(["| Checkout | Revision |", "|:---|:---|", rows...], '\n')
          println(report)
          summary = get(ENV, "GITHUB_STEP_SUMMARY", "")
          isempty(summary) || open(io -> print(io, "### Ecosystem layout\n\n", report, "\n\n"), summary, "a")
      # <<< ecosystem layout

      - uses: julia-actions/cache@v3

      # Four threads on one cell: the thread-count-independence test (the
      # `se=:bootstrap` replicates are seeded serially from the caller's rng
      # and only the refits are threaded) compares an in-process fit against
      # a fresh process with a different thread count, so at least one cell
      # must not run on one.
      - name: Run tests
        shell: bash
        working-directory: ERGMCount.jl
        env:
          JULIA_NUM_THREADS: ${{ (matrix.version == '1' && matrix.os == 'ubuntu-latest') && '4' || '1' }}
          COVERAGE: ${{ env.HAS_CODECOV_TOKEN == 'true' && matrix.version == '1.12' && matrix.os == 'ubuntu-latest' }}
        run: julia --project=. -e 'using Pkg; Pkg.test(coverage=ENV["COVERAGE"] == "true")'

      # The allocation-regression gates: the standalone benchmark environment
      # must instantiate from its committed [sources] (`..` and the siblings
      # cloned above), and the per-dyad Gibbs, design-build, derivative and
      # sweep-scaling pins must hold. `Pkg.test()` guards the same pins; this
      # step proves that the harness the site's tools/run_benchmarks.jl consumes
      # runs.
      - name: Allocation regression gates (benchmark environment)
        if: matrix.version == '1' && matrix.os == 'ubuntu-latest'
        shell: bash
        working-directory: ERGMCount.jl
        env:
          JULIA_NUM_THREADS: 4
        run: |
          julia --project=benchmark -e 'using Pkg; Pkg.instantiate()'
          julia --project=benchmark benchmark/regression_tests.jl

      - uses: julia-actions/julia-processcoverage@v1
        if: env.HAS_CODECOV_TOKEN == 'true' && matrix.version == '1.12' && matrix.os == 'ubuntu-latest'
        with:
          directories: ERGMCount.jl/src

      - uses: codecov/codecov-action@v7
        if: env.HAS_CODECOV_TOKEN == 'true' && matrix.version == '1.12' && matrix.os == 'ubuntu-latest'
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
